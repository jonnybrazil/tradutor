<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tradução ao vivo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','PingFang SC','Microsoft YaHei',Arial,sans-serif;
 background:#111318;color:#e9ecf1;font-size:21px;line-height:1.55}
body.claro{background:#fbfbf9;color:#15181d}
header{position:sticky;top:0;z-index:10;background:rgba(17,19,24,.92);backdrop-filter:blur(8px);
 border-bottom:1px solid #242833;padding:10px 16px 9px}
body.claro header{background:rgba(251,251,249,.94);border-bottom:1px solid #e2e2dd}
.topo{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.titulo{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;flex:1;min-width:0;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.botoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:15px;padding:7px 12px;border-radius:9px;border:1px solid #333846;
 background:#1b1f27;color:#e9ecf1;cursor:pointer}
body.claro button{background:#fff;border:1px solid #d6d6d0;color:#15181d}
button:active{transform:scale(.97)}
select{font:inherit;font-size:15px;padding:7px 8px;border-radius:9px;border:1px solid #333846;
 background:#1b1f27;color:#e9ecf1;max-width:46%}
body.claro select{background:#fff;border:1px solid #d6d6d0;color:#15181d}
main{max-width:760px;margin:0 auto;padding:22px 20px 160px}
.bloco{margin:0 0 26px;padding:0 0 0 14px;border-left:3px solid #2f6feb33}
body.claro .bloco{border-left:3px solid #2f6feb55}
.hora{display:block;font-size:12px;letter-spacing:.05em;opacity:.42;margin-bottom:4px}
.bloco p{margin:0;white-space:pre-wrap;word-wrap:break-word}
.bloco .traduzir{display:inline-block;margin-top:7px;font-size:13px;letter-spacing:.02em;
 color:#7f9bc9;text-decoration:none;border-bottom:1px dotted #7f9bc966;padding-bottom:1px}
body.claro .bloco .traduzir{color:#3f6fb8;border-bottom-color:#3f6fb866}
.novo{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:20;
 background:#2f6feb;color:#fff;border:none;padding:12px 20px;border-radius:999px;
 box-shadow:0 6px 22px rgba(0,0,0,.35);font-size:16px;display:none}
.vazio{opacity:.45;text-align:center;margin-top:60px;font-size:18px}
.status{width:9px;height:9px;border-radius:50%;background:#2fbf71;display:inline-block}
.status.off{background:#e5484d}
.aviso{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:40;display:none;
 background:#e5484d;color:#fff;padding:7px 14px;border-radius:999px;font-size:14px;
 box-shadow:0 4px 16px rgba(0,0,0,.3)}
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
 background:#111318;padding:28px;text-align:center}
body.claro .overlay{background:#fbfbf9}
.overlay.escondido{display:none}
.cartao{max-width:520px}
.cartao h2{font-size:27px;margin:0 0 12px;font-weight:600;line-height:1.25}
.cartao p{margin:0;font-size:19px;opacity:.7;white-space:pre-wrap}
.pulso{width:52px;height:52px;border-radius:50%;margin:0 auto 24px;
 border:3px solid #2f6feb33;border-top-color:#2f6feb;animation:gira 1.1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
 <div class="topo"><span class="status" id="st"></span><span class="titulo" data-i18n="titulo">Tradução ao vivo</span></div>
 <div class="botoes">
  <button id="menor">A-</button><button id="maior">A+</button>
  <button id="claro" data-i18n="tema">Tema</button>
  <button id="copiar" data-i18n="copiar">Copiar tudo</button>
  <select id="lang" title="Language">
   <option value="pt-BR">Português</option>
   <option value="en">English</option>
   <option value="zh-CN">中文</option>
   <option value="es">Español</option>
   <option value="fr">Français</option>
  </select>
 </div>
</header>

<main id="lista"><div class="vazio" id="vazio" data-i18n="vazio">Aguardando o início...</div></main>

<button class="novo" id="novo" data-i18n="novo">Novo conteúdo &darr;</button>
<div class="aviso" id="aviso" data-i18n="off_aviso">Sem conexão, reconectando...</div>

<div class="overlay" id="overlay">
 <div class="cartao">
  <div class="pulso" id="ov-spinner"></div>
  <h2 id="ov-titulo" data-i18n="t_espera">A tradução começa em instantes</h2><p id="ov-texto"></p>
 </div>
</div>

<script src="config.js"></script>
<script>
/* A URL da API e a chave ficam em config.js */
const CONFIG = window.CONFIG || {};
const BASE = CONFIG.api || '/exec';
const INTERVALO = 4000;      /* ms entre consultas */
const TRAD_DE = 'en';        /* idioma do conteudo (o que voce traduz) */

/* ===== idiomas ===== */
const T = {
 'pt-BR':{titulo:'Tradução ao vivo',tema:'Tema',copiar:'Copiar tudo',copiado:'Copiado',traduzir:'traduzir',
   novo:'Novo conteúdo ↓',vazio:'Aguardando o início...',off_aviso:'Sem conexão, reconectando...',
   t_espera:'A tradução começa em instantes',t_pausa:'Pausa',t_fim:'Reunião encerrada',t_off:'Serviço indisponível'},
 'en':{titulo:'Live translation',tema:'Theme',copiar:'Copy all',copiado:'Copied',traduzir:'translate',
   novo:'New content ↓',vazio:'Waiting for it to start...',off_aviso:'No connection, reconnecting...',
   t_espera:'The translation starts shortly',t_pausa:'Break',t_fim:'Meeting ended',t_off:'Service unavailable'},
 'zh-CN':{titulo:'实时翻译',tema:'主题',copiar:'复制全部',copiado:'已复制',traduzir:'翻译',
   novo:'新内容 ↓',vazio:'等待开始……',off_aviso:'连接中断，正在重连……',
   t_espera:'翻译即将开始',t_pausa:'休息',t_fim:'会议结束',t_off:'服务暂不可用'},
 'es':{titulo:'Traducción en vivo',tema:'Tema',copiar:'Copiar todo',copiado:'Copiado',traduzir:'traducir',
   novo:'Contenido nuevo ↓',vazio:'Esperando el inicio...',off_aviso:'Sin conexión, reconectando...',
   t_espera:'La traducción comienza en breve',t_pausa:'Pausa',t_fim:'Reunión terminada',t_off:'Servicio no disponible'},
 'fr':{titulo:'Traduction en direct',tema:'Thème',copiar:'Tout copier',copiado:'Copié',traduzir:'traduire',
   novo:'Nouveau contenu ↓',vazio:"En attente du début...",off_aviso:'Hors ligne, reconnexion...',
   t_espera:'La traduction commence dans un instant',t_pausa:'Pause',t_fim:'Réunion terminée',t_off:'Service indisponible'}
};

let idioma='pt-BR';
let ultimo=0, fixo=true, tamanho=21, primeira=true, buscando=false;
let blocos=[];
let estadoAtual={estado:'espera',mensagem:''};
let revisao=null;

const main=document.getElementById('lista'), novo=document.getElementById('novo');
const status=document.getElementById('st'), aviso=document.getElementById('aviso');
const overlay=document.getElementById('overlay'), ovTitulo=document.getElementById('ov-titulo');
const ovTexto=document.getElementById('ov-texto'), spinner=document.getElementById('ov-spinner');
const bCopiar=document.getElementById('copiar'), seletor=document.getElementById('lang');

function t(k){ return (T[idioma]&&T[idioma][k])||T['pt-BR'][k]||k; }

function aplicarIdioma(cod){
  idioma = T[cod] ? cod : 'pt-BR';
  document.documentElement.lang = idioma;
  [].forEach.call(document.querySelectorAll('[data-i18n]'),function(el){
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  if(bCopiar.textContent!==t('copiar')) bCopiar.textContent=t('copiar');
  if(seletor.value!==idioma) seletor.value=idioma;
  atualizarOverlay();
  redesenhar();
  try{ localStorage.setItem('idioma',idioma); }catch(e){}
}

/* destino do link "traduzir" acompanha o idioma escolhido.
   O conteudo chega em ingles, entao interface em ingles usa mandarim como destino. */
function codTrad(){
  if(idioma==='en') return 'zh-CN';
  return idioma==='pt-BR' ? 'pt' : idioma;
}
function tradUrl(txt){
  return 'https://translate.google.com/?sl='+TRAD_DE+'&tl='+codTrad()+'&op=translate&text='+encodeURIComponent(txt);
}

function aplicarFonte(){document.body.style.fontSize=tamanho+'px';}
function pertoDoFim(){return window.innerHeight+window.scrollY >= document.body.scrollHeight-140;}
window.addEventListener('scroll',function(){fixo=pertoDoFim(); if(fixo) novo.style.display='none';});
novo.onclick=function(){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});novo.style.display='none';fixo=true;};

function hora(ts){var d=new Date(ts);return d.toLocaleTimeString(idioma,{hour:'2-digit',minute:'2-digit'});}

function criarEl(b){
  var el=document.createElement('div'); el.className='bloco';
  var h=document.createElement('span'); h.className='hora'; h.textContent=hora(b.t); el.appendChild(h);
  var p=document.createElement('p'); p.textContent=b.x; el.appendChild(p);
  if(b.x.length<=1500){
    var a=document.createElement('a');
    a.className='traduzir'; a.textContent=t('traduzir'); a.target='_blank'; a.rel='noopener';
    a.href=tradUrl(b.x);
    el.appendChild(a);
  }
  return el;
}

function redesenhar(){
  main.innerHTML='';
  if(!blocos.length){
    var v=document.createElement('div'); v.className='vazio'; v.textContent=t('vazio');
    main.appendChild(v); return;
  }
  blocos.forEach(function(b){ main.appendChild(criarEl(b)); });
}

function pintar(b){ blocos.push(b); main.appendChild(criarEl(b)); }

function cachear(){
  try{ localStorage.setItem('blocos_cache',JSON.stringify(blocos)); }catch(e){}
}
function doCache(){
  try{
    var arr=JSON.parse(localStorage.getItem('blocos_cache')||'[]');
    if(arr.length){ blocos=arr; redesenhar(); return true; }
  }catch(e){}
  return false;
}

function atualizarOverlay(){
  if(estadoAtual.estado==='ao-vivo'){ overlay.classList.add('escondido'); return; }
  overlay.classList.remove('escondido');
  var mapa={espera:'t_espera',pausa:'t_pausa',fim:'t_fim',off:'t_off'};
  ovTitulo.textContent=t(mapa[estadoAtual.estado]||'t_espera');
  ovTexto.textContent=estadoAtual.mensagem||'';
  spinner.style.display=(estadoAtual.estado==='espera'||estadoAtual.estado==='off')?'block':'none';
}

function limparTudo(){main.innerHTML=''; blocos=[]; ultimo=0; try{localStorage.removeItem('blocos_cache');}catch(e){}}

function carregar(){
  if(buscando) return;
  buscando=true;
  fetch(BASE+'?action=blocks&since='+ultimo,{cache:'no-store'})
   .then(function(r){if(!r.ok) throw new Error('http');return r.json();})
   .then(function(d){
     if(d.erro) throw new Error(d.erro);
     status.className='status'; aviso.style.display='none';

     /* um bloco foi editado: recarrega a lista inteira */
     if(typeof d.revisao==='number'){
       if(revisao!==null && d.revisao!==revisao){
         revisao=d.revisao;
         ultimo=0; primeira=true;
         setTimeout(carregar,50);
         return;
       }
       revisao=d.revisao;
     }

     if(d.ultimo < ultimo){ limparTudo(); }

     var novos=d.blocks||[];
     if(primeira){
       /* o servidor manda: descarta o cache e redesenha */
       var y=window.scrollY;
       blocos=[]; main.innerHTML='';
       novos.forEach(pintar);
       if(!novos.length) redesenhar();
       ultimo=d.ultimo; cachear(); primeira=false;
       if(fixo) window.scrollTo({top:document.body.scrollHeight});
       else if(y) window.scrollTo(0,y);
     } else if(novos.length){
       var noFim=fixo;
       novos.forEach(pintar);
       ultimo=d.ultimo; cachear();
       if(noFim) window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
       else novo.style.display='block';
     }

     estadoAtual=d.estado||{estado:'ao-vivo',mensagem:''};
     atualizarOverlay();
   })
   .catch(function(){
     status.className='status off';
     aviso.style.display='block';
     if(!blocos.length){
       if(!doCache()){ estadoAtual={estado:'off',mensagem:''}; atualizarOverlay(); }
     }
   })
   .then(function(){ buscando=false; });
}

document.getElementById('maior').onclick=function(){tamanho=Math.min(34,tamanho+2);aplicarFonte();};
document.getElementById('menor').onclick=function(){tamanho=Math.max(15,tamanho-2);aplicarFonte();};
document.getElementById('claro').onclick=function(){document.body.classList.toggle('claro');};
seletor.onchange=function(){ aplicarIdioma(seletor.value); };

bCopiar.onclick=function(){
  var txt=blocos.map(function(b){return b.x;}).join('\n\n');
  function feito(){bCopiar.textContent=t('copiado');setTimeout(function(){bCopiar.textContent=t('copiar');},1600);}
  function fallback(x){
    var a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();
    try{document.execCommand('copy');}catch(e){} a.remove();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(feito,function(){fallback(txt);feito();});
  } else { fallback(txt); feito(); }
};

/* idioma salvo na visita anterior */
const IDIOMA_PADRAO = CONFIG.idioma || 'pt-BR';   /* pode ser definido em config.js */
try{ aplicarIdioma(localStorage.getItem('idioma')||IDIOMA_PADRAO); }catch(e){ aplicarIdioma(IDIOMA_PADRAO); }
aplicarFonte();
doCache();
carregar();
setInterval(function(){ if(!document.hidden) carregar(); },INTERVALO);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) carregar(); });
</script>
</body>
</html>
