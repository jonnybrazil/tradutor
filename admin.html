<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel do intérprete</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
 background:#111318;color:#e9ecf1;font-size:16px;line-height:1.5}
header{position:sticky;top:0;z-index:10;background:rgba(17,19,24,.94);backdrop-filter:blur(8px);
 border-bottom:1px solid #242833;padding:12px 16px;display:flex;align-items:center;gap:10px}
.titulo{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;flex:1}
main{max-width:720px;margin:0 auto;padding:20px 16px 80px}
button{font:inherit;font-size:15px;padding:8px 13px;border-radius:9px;border:1px solid #333846;
 background:#1b1f27;color:#e9ecf1;cursor:pointer}
button:active{transform:scale(.97)}
button.principal{background:#2f6feb;border-color:#2f6feb;color:#fff}
button.ativo{background:#2f6feb;border-color:#2f6feb;color:#fff}
button.gravando{background:#e5484d;border-color:#e5484d;color:#fff}
select.sel{font:inherit;font-size:15px;padding:8px 10px;border-radius:9px;border:1px solid #333846;
 background:#1b1f27;color:#e9ecf1}
.ouvindo{display:none;align-items:center;gap:7px;font-size:14px;color:#ff9a9a}
.ouvindo i{width:9px;height:9px;border-radius:50%;background:#e5484d;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.25}}
.rotulo{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin:0 0 8px}
.linha{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
textarea{width:100%;min-height:150px;font:inherit;font-size:18px;padding:14px;border-radius:10px;
 border:1px solid #333846;background:#1b1f27;color:#e9ecf1;resize:vertical}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;
 border:1px solid #333846;background:#1b1f27;color:#e9ecf1}
.item{border:1px solid #242833;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:15px;
 display:flex;align-items:flex-start;gap:10px}
.item .hora{display:block;margin:0 0 3px;font-size:11px;opacity:.45}
.item .txt{flex:1;min-width:0;white-space:pre-wrap}
.item button{padding:3px 9px;font-size:13px;white-space:nowrap;flex:0 0 auto}
a.botao{font:inherit;font-size:15px;padding:9px 13px;border-radius:9px;border:1px solid #333846;
 background:#1b1f27;color:#e9ecf1;text-decoration:none;display:inline-block}
.vazio{opacity:.45;margin-top:10px}
.aviso{font-size:14px;padding:8px 12px;border-radius:8px;background:#3a1d1f;color:#ffb4b4;
 margin-bottom:14px;display:none}
.ok{background:#16301f;color:#8ce0a8}
</style>
</head>
<body>

<header>
 <span class="titulo">Painel do intérprete</span>
 <button onclick="limparTudo()">Limpar tudo</button>
</header>

<main>
<div class="aviso" id="aviso"></div>

<p class="rotulo">Tela do ouvinte</p>
<div class="linha">
 <button data-e="espera" onclick="mudarEstado('espera')">Espera</button>
 <button data-e="ao-vivo" onclick="mudarEstado('ao-vivo')">Ao vivo</button>
 <button data-e="pausa" onclick="mudarEstado('pausa')">Pausa</button>
 <button data-e="fim" onclick="mudarEstado('fim')">Encerrado</button>
</div>
<input type="text" id="msg" placeholder="Mensagem só desta troca (vazio = usa o texto das telas)">
<div class="linha" style="margin-top:10px">
 <button onclick="mudarEstado(estado)">Aplicar mensagem</button>
</div>

<p class="rotulo">Textos das telas</p>
<input type="text" id="tx-espera" placeholder="Espera (vazio = tela sem texto)">
<input type="text" id="tx-pausa" placeholder="Pausa" style="margin-top:8px">
<input type="text" id="tx-fim" placeholder="Encerrado" style="margin-top:8px">
<div class="linha" style="margin-top:10px">
 <button onclick="salvarTextos()">Salvar textos</button>
</div>

<p class="rotulo">Novo bloco</p>
<textarea id="ta" placeholder="Cole aqui o bloco traduzido e publique (Ctrl+Enter)"></textarea>
<div class="linha" style="margin-top:10px">
 <button id="mic" onclick="alternarDitado()">Ditar</button>
 <select id="idioma" class="sel" title="Idioma do ditado">
  <option value="en-US">Inglês</option>
  <option value="pt-BR">Português</option>
 </select>
 <span class="ouvindo" id="ouvindo"><i></i>ouvindo...</span>
</div>
<div class="linha" style="margin-top:10px">
 <button class="principal" onclick="publicar()">Publicar bloco</button>
 <a class="botao" href="index.html" target="_blank">Ver página do ouvinte</a>
</div>

<p class="rotulo">Publicados</p>
<div id="itens"><div class="vazio">Carregando...</div></div>
</main>

<script src="config.js"></script>
<script>
/* A URL da API e a chave ficam em config.js */
const CONFIG = window.CONFIG || {};
const BASE = CONFIG.api || '/exec';
const CHAVE = CONFIG.chave || 'igreja2026';

const ta=document.getElementById('ta'), msg=document.getElementById('msg');
const aviso=document.getElementById('aviso');
const txEspera=document.getElementById('tx-espera'), txPausa=document.getElementById('tx-pausa'),
      txFim=document.getElementById('tx-fim');
let estado='espera';
let msgSujo=false;      /* voce digitou algo que ainda nao foi enviado */
let seq=0;              /* descarta respostas antigas da consulta */
let bloqueioAte=0;      /* ignora o estado do servidor por alguns segundos apos trocar */
let editando=false;     /* um bloco esta aberto para edicao: nao redesenhar a lista */

msg.addEventListener('input',function(){ msgSujo=true; });

function mostrarAviso(txt, bom){
  aviso.textContent=txt;
  aviso.className='aviso'+(bom?' ok':'');
  aviso.style.display='block';
  setTimeout(function(){aviso.style.display='none';},4000);
}

function postar(obj){
  var corpo=Object.assign({},obj,{k:CHAVE});
  return fetch(BASE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(corpo)})
    .then(function(r){ return r.json(); })
    .catch(function(){ return {erro:'sem conexao'}; });
}

function publicar(){
  var x=ta.value.trim();
  if(!x) return;
  postar({action:'add',x:x}).then(function(d){
    if(d && d.erro){ mostrarAviso('Nao publicado: '+d.erro,false); return; }
    ta.value='';
    if(ditando){
      /* o ditado continua: limpa o texto ja publicado e abre uma sessao nova */
      base=''; sessaoFinal=''; ultimoFinalAnterior=''; primeiroFinal=true;
      try{ rec.stop(); }catch(e){}
    }
    /* no celular, nao rouba o foco para o teclado nao subir */
    if(!('ontouchstart' in window)) ta.focus();
    setTimeout(carregar,300);
  });
}

function mudarEstado(e){
  estado=e;
  pintarEstado();
  var texto=msg.value.trim();
  bloqueioAte=Date.now()+9000;
  postar({action:'estado',estado:e,mensagem:texto}).then(function(d){
    if(d && d.erro){ bloqueioAte=0; mostrarAviso('Nao enviado: '+d.erro,false); return; }
    msgSujo=false;
    mostrarAviso('Tela do ouvinte: '+e,true);
    setTimeout(carregar,1500);
  });
}

function apagar(id){
  postar({action:'apagar',id:id}).then(function(d){
    if(d && d.erro){ mostrarAviso('Nao apagado: '+d.erro,false); return; }
    setTimeout(carregar,300);
  });
}

function limparTudo(){
  if(!confirm('Apagar todos os blocos?')) return;
  postar({action:'limpar'}).then(function(d){
    if(d && d.erro){ mostrarAviso('Nao apagado: '+d.erro,false); return; }
    setTimeout(carregar,300);
  });
}

/* textos das telas: ficam no backend, nao na pagina */
function carregarTextos(){
  fetch(BASE+'?action=textos',{cache:'no-store'})
   .then(function(r){return r.json();})
   .then(function(d){
     if(!d || d.erro) return;
     txEspera.value=d.espera||''; txPausa.value=d.pausa||''; txFim.value=d.fim||'';
   })
   .catch(function(){});
}

function salvarTextos(){
  postar({action:'textos',textos:{espera:txEspera.value,pausa:txPausa.value,fim:txFim.value}})
   .then(function(d){
     if(d && d.erro){ mostrarAviso('Nao salvo: '+d.erro,false); return; }
     mostrarAviso('Textos salvos.',true);
   });
}

function pintarEstado(){
  [].forEach.call(document.querySelectorAll('[data-e]'),function(b){
    b.classList.toggle('ativo', b.dataset.e===estado);
  });
}

function carregar(){
  var meu=++seq;
  fetch(BASE+'?action=blocks&since=0',{cache:'no-store'})
   .then(function(r){return r.json();})
   .then(function(d){
     if(meu!==seq) return;                 /* chegou uma resposta mais nova antes */
     if(d.erro){mostrarAviso(d.erro);return;}

     /* nao deixa uma leitura antiga desfazer a troca de estado que voce acabou de fazer,
        nem apagar a mensagem que voce esta digitando */
     if(Date.now()>=bloqueioAte){
       estado=(d.estado&&d.estado.estado)||'espera';
       if(!msgSujo) msg.value=(d.estado&&d.estado.mensagem)||'';
       pintarEstado();
     }

     if(editando) return;   /* nao apaga o editor aberto */

     var box=document.getElementById('itens');
     box.innerHTML='';
     if(!d.blocks||!d.blocks.length){
       box.innerHTML='<div class="vazio">Nada publicado ainda.</div>';
       return;
     }
     d.blocks.forEach(function(b){
       var el=document.createElement('div'); el.className='item';
       var caixa=document.createElement('div'); caixa.className='txt';
       var h=document.createElement('span'); h.className='hora';
       h.textContent=new Date(b.t).toLocaleTimeString('pt-BR'); caixa.appendChild(h);
       var p=document.createElement('span'); p.textContent=b.x; caixa.appendChild(p);
       el.appendChild(caixa);
       var edit=document.createElement('button'); edit.textContent='editar';
       edit.onclick=function(){ editarBloco(b,caixa); };
       el.appendChild(edit);
       var del=document.createElement('button'); del.textContent='apagar';
       del.onclick=function(){apagar(b.id);};
       el.appendChild(del); box.appendChild(el);
     });
   })
   .catch(function(){ mostrarAviso('Sem conexao com o servico.'); });
}

ta.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();publicar();}
});

/* edicao de um bloco ja publicado */
function editarBloco(b, caixa){
  editando=true;
  caixa.innerHTML='';
  var area=document.createElement('textarea');
  area.value=b.x;
  area.rows=Math.min(10, Math.max(2, Math.ceil(b.x.length/50)));
  caixa.appendChild(area);

  var acoes=document.createElement('div');
  acoes.className='linha'; acoes.style.marginTop='8px';
  var salvar=document.createElement('button'); salvar.textContent='salvar'; salvar.className='principal';
  var cancelar=document.createElement('button'); cancelar.textContent='cancelar';

  salvar.onclick=function(){
    var x=area.value.trim();
    if(!x) return;
    salvar.textContent='salvando...'; salvar.disabled=true;
    postar({action:'editar',id:b.id,x:x}).then(function(d){
      if(d && d.erro){
        salvar.textContent='salvar'; salvar.disabled=false;
        mostrarAviso('Nao gravado: '+d.erro,false);
        return;
      }
      editando=false;
      mostrarAviso('Bloco editado.',true);
      setTimeout(carregar,500);
    });
  };
  cancelar.onclick=function(){ editando=false; carregar(); };

  acoes.appendChild(salvar); acoes.appendChild(cancelar);
  caixa.appendChild(acoes);
  area.focus();
  area.setSelectionRange(area.value.length, area.value.length);
}

/* ===== ditado (Web Speech API, Chrome e Safari) ===== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById('mic');
const idioma = document.getElementById('idioma');
const ouvindo = document.getElementById('ouvindo');
let rec=null, ditando=false, base='', sessaoFinal='', tentativas=0;
let primeiroFinal=true, ultimoFinalAnterior='';

function norm(s){ return String(s||'').replace(/\s+/g,' ').trim().toLowerCase(); }
function juntar(a,b){
  if(!a) return b||'';
  if(!b) return a;
  return (/[\s]$/.test(a) || /^\s/.test(b)) ? a+b : a+' '+b;
}

if(!SR){
  mic.style.display='none';
  idioma.style.display='none';
}

function alternarDitado(){ if(ditando) pararDitado(); else iniciarDitado(); }

function iniciarDitado(){
  if(!SR || ditando) return;
  base = ta.value;
  if(base && !/\s$/.test(base)) base += ' ';
  sessaoFinal='';
  tentativas=0;
  primeiroFinal=true;
  ultimoFinalAnterior='';
  ditando=true;
  mic.textContent='Parar';
  mic.classList.add('gravando');
  ouvindo.style.display='flex';
  novaSessao();
}

/* Cada sessao usa um objeto novo: o Chrome limpa os resultados ao reiniciar */
function novaSessao(){
  if(!ditando) return;
  rec = new SR();
  rec.lang = idioma.value;
  rec.continuous = true;
  rec.interimResults = true;

  rec.onresult = function(ev){
    /* refaz o texto inteiro a cada evento, em vez de somar: evita repeticao */
    var txt='', par='';
    for(var i=0;i<ev.results.length;i++){
      var r=ev.results[i];
      var t=r[0].transcript;
      if(r.isFinal){
        var nt=norm(t), nu=norm(ultimoFinalAnterior);
        if(primeiroFinal){
          primeiroFinal=false;
          /* o Chrome reenvia a ultima frase quando reinicia a sessao */
          if(nu && nt===nu) continue;
          if(nu && nt.indexOf(nu)===0){
            var pos=t.toLowerCase().indexOf(ultimoFinalAnterior.toLowerCase());
            if(pos===0){
              t=t.slice(ultimoFinalAnterior.length);
              if(!norm(t)) continue;
              nt=norm(t);
            }
          }
        }
        var ntxt=norm(txt);
        /* o mesmo trecho pode chegar como final duas vezes seguidas */
        if(ntxt && nt===ntxt) continue;
        /* ... ou repetir o anterior e continuar a frase */
        if(ntxt && nt.indexOf(ntxt)===0){ txt=t; continue; }
        /* ... ou ser um pedaco que ja esta no texto */
        if(ntxt && ntxt.indexOf(nt)===0) continue;
        txt=juntar(txt,t);
      } else {
        /* o Chrome cria um parcial novo a cada atualizacao da mesma frase:
           so o mais recente interessa */
        par=t;
      }
    }
    /* o parcial pode repetir o final, ou ser um pedaco dele, ou ser o final incompleto */
    if(par && txt){
      var np=norm(par), nt=norm(txt);
      if(np && nt && (np.indexOf(nt)===0 || nt.indexOf(np)===0 || nt.slice(-np.length)===np)) par='';
    }

    /* se a lista de resultados recomecou no meio da sessao, guarda o que ja havia */
    var ntxtSessao=norm(sessaoFinal), nTxt=norm(txt);
    if(ntxtSessao && (!nTxt || nTxt.indexOf(ntxtSessao)!==0)){
      base=juntar(base,sessaoFinal);
      sessaoFinal='';
    }

    sessaoFinal=txt;
    tentativas=0;
    ta.value = juntar(juntar(base,sessaoFinal),par);
    ta.scrollTop = ta.scrollHeight;
  };

  rec.onerror = function(ev){
    var erro=ev.error||'';
    if(erro==='not-allowed'||erro==='service-not-allowed'){
      mostrarAviso('Microfone bloqueado. Libere a permissao no navegador.',false);
      encerrarDitado();
    } else if(erro==='network'){
      mostrarAviso('Sem conexao para o ditado.',false);
    } else if(erro!=='no-speech' && erro!=='aborted'){
      mostrarAviso('Ditado: '+erro,false);
    }
  };

  /* o Chrome encerra sozinho depois de uma pausa; consolidamos e abrimos outra sessao */
  rec.onend = function(){
    base = ta.value;
    if(sessaoFinal) ultimoFinalAnterior=sessaoFinal;
    sessaoFinal='';
    primeiroFinal=true;
    if(ditando){
      tentativas++;
      if(tentativas < 8){
        setTimeout(function(){ if(ditando) novaSessao(); }, 250);
      } else {
        mostrarAviso('Ditado parou por falta de fala. Toque em Ditar para retomar.',false);
        encerrarDitado();
      }
    } else {
      interfaceParado();
    }
  };

  try{ rec.start(); }catch(e){ encerrarDitado(); }
}

function encerrarDitado(){
  ditando=false;
  if(rec){ try{ rec.stop(); }catch(e){} }
  interfaceParado();
}

function pararDitado(){ if(ditando) encerrarDitado(); }

function interfaceParado(){
  mic.textContent='Ditar';
  mic.classList.remove('gravando');
  ouvindo.style.display='none';
}

carregar();
carregarTextos();
setInterval(carregar,5000);
</script>
</body>
</html>
